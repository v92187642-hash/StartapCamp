server:
  port: 8080

spring:
  application:
    name: core
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core
  flyway:
    schemas: core
    default-schema: core
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: simple
    connection-timeout: 2s
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  messages:
    basename: messages
    encoding: UTF-8
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000

otmetka:
  jwt:
    secret: ${JWT_SECRET}
    issuer: otmetka
    audience: otmetka
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@otmetka.local}
  test-accounts:
    enabled: ${SEED_TEST_ACCOUNTS:false}
  premium:
    enforced: ${PREMIUM_ENFORCED:true}
  notifier:
    url: ${NOTIFIER_URL}
    secret: ${INTERNAL_SECRET}
  web-base-url: ${WEB_BASE_URL}
  rate-limit:
    register-per-ip: ${REGISTER_PER_IP:10}
    register-window-minutes: ${REGISTER_WINDOW_MINUTES:60}
