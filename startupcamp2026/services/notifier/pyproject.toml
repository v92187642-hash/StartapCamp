[project]
name = "notifier"
version = "0.1.0"
description = "Отметка: alerts to relatives, device tokens, reports"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "aio-pika>=9.5",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "reportlab>=4.2",
    "google-auth>=2.35",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.9",
    "pypdf>=6.19.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
